name: nodus

# ==============================================================================
# NODUS — entorno de desarrollo reproducible.
#
# Objetivo (brief §5): que el evaluador no tenga que instalar PostgreSQL, Redis,
# MinIO ni un servidor SMTP a mano. Docker aquí es reproducibilidad, no una
# optimización de rendimiento.
#
#   docker compose up -d                 # sólo infraestructura + api + web + worker
#   docker compose up -d postgres redis minio mailpit   # sólo infra (dev híbrido)
# ==============================================================================

services:
  # --------------------------------------------------------------- PostgreSQL --
  postgres:
    image: postgres:16-alpine
    container_name: nodus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nodus}
      # Rendimiento de desarrollo: menos fsync, arranque más rápido.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nodus} -d ${POSTGRES_DB:-nodus}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [nodus]

  # -------------------------------------------------------------------- Redis --
  redis:
    image: redis:7-alpine
    container_name: nodus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nodus]

  # -------------------------------------------------------------------- MinIO --
  # Storage S3-compatible. El mismo adaptador S3 sirve para AWS/R2 en producción.
  minio:
    image: quay.io/minio/minio:latest
    container_name: nodus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-nodus_minio_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-nodus_minio_secret_key}
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [nodus]

  # Crea el bucket una sola vez y termina.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: nodus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set nodus http://minio:9000 ${S3_ACCESS_KEY:-nodus_minio_access} ${S3_SECRET_KEY:-nodus_minio_secret_key} &&
      mc mb --ignore-existing nodus/${S3_BUCKET:-nodus-documents} &&
      mc anonymous set none nodus/${S3_BUCKET:-nodus-documents} &&
      echo 'bucket ${S3_BUCKET:-nodus-documents} listo';
      "
    networks: [nodus]

  # ------------------------------------------------------------------ Mailpit --
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: nodus-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # UI web
    volumes:
      - mailpit_data:/data
    networks: [nodus]

  # ------------------------------------------------------------------ Migrate --
  # Servicio de un solo uso: aplica las migraciones y termina.
  #
  # Está separado a propósito. Ejecutarlas en el arranque de la API significa que
  # cada reinicio del contenedor lanza otro `migrate deploy`, y dos procesos
  # compitiendo por el advisory lock de PostgreSQL hacen que ambos fallen por
  # timeout. Con un servicio propio, las migraciones corren exactamente una vez y
  # la API sólo arranca cuando han terminado bien.
  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: development
    container_name: nodus-migrate
    restart: "no"
    command: pnpm --filter @nodus/api exec prisma migrate deploy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-nodus}:${POSTGRES_PASSWORD:-nodus_dev_password}@postgres:5432/${POSTGRES_DB:-nodus}?schema=public&connection_limit=5&pool_timeout=20
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: { condition: service_healthy }
    networks: [nodus]

  # ---------------------------------------------------------------------- API --
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: development
    container_name: nodus-api
    restart: unless-stopped
    command: pnpm --filter @nodus/api dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-nodus}:${POSTGRES_PASSWORD:-nodus_dev_password}@postgres:5432/${POSTGRES_DB:-nodus}?schema=public&connection_limit=15&pool_timeout=20
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      API_PORT: 4000
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
    env_file:
      - path: .env
        required: false
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./packages:/app/packages
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [nodus]

  # ------------------------------------------------------------------- Worker --
  # Mismo código que la API, distinto entrypoint. Procesa email, notificaciones,
  # evaluación de SLA y alertas. Nada pesado ocurre dentro de un request HTTP.
  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: development
    container_name: nodus-worker
    restart: unless-stopped
    command: pnpm --filter @nodus/api dev:worker
    environment:
      NODE_ENV: development
      WORKER_MODE: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-nodus}:${POSTGRES_PASSWORD:-nodus_dev_password}@postgres:5432/${POSTGRES_DB:-nodus}?schema=public&connection_limit=5&pool_timeout=20
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      APP_URL: http://localhost:3000
    env_file:
      - path: .env
        required: false
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./packages:/app/packages
    depends_on:
      api: { condition: service_healthy }
    networks: [nodus]

  # ---------------------------------------------------------------------- Web --
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: development
    container_name: nodus-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # El navegador llama a localhost; el SSR de Next llama al servicio interno.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      INTERNAL_API_URL: http://api:4000/api/v1
      WATCHPACK_POLLING: 'true'
    env_file:
      - path: .env
        required: false
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages:/app/packages
    depends_on:
      api: { condition: service_healthy }
    networks: [nodus]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mailpit_data:

networks:
  nodus:
    driver: bridge
